[package]
name = "keystone-web-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
keystone-core = { path = "../core" }

# Async runtime (server only)
tokio = { workspace = true, optional = true }

# Web framework (server only)
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["trace", "fs", "cors"], optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }

# Leptos (frontend)
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling (server only)
anyhow = { workspace = true, optional = true }
thiserror.workspace = true

# Logging (server only)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

# HTTP client for proxying (server only)
reqwest = { version = "0.12", features = ["json"], optional = true }

# WASM support
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6.0", features = ["json"] }
gloo-timers = "0.3"
web-sys = { version = "0.3.83", features = ["Window", "Storage"] }

[features]
default = ["server"]
server = ["tokio", "axum", "tower", "tower-http", "hyper", "hyper-util", "anyhow", "tracing", "tracing-subscriber", "reqwest"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "keystone-web-ui"
path = "src/main.rs"
required-features = ["server"]
