# Keystone drop-in for the caddy package's unit.
#
# Keystone's generated Caddyfile writes an access log to
# /var/log/caddy/keystone-access.log. The packaged unit runs with
# ProtectSystem=strict and only makes that directory writable if its
# ReadWritePaths entry matched when the service's mount namespace was built;
# otherwise Caddy fails with "read-only file system". LogsDirectory= makes
# systemd create the directory (owned by caddy) and mount it writable on every
# start, regardless of the packaged unit.
[Service]
LogsDirectory=caddy
LogsDirectoryMode=0750
