[workspace]
members = ["core", "daemon", "web-ui", "ctl"]
resolver = "2"

[workspace.package]
version = "0.4.21"
edition = "2024"
rust-version = "1.99"
authors = ["Keystone Project"]
license = "GPL-3.0-only"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
ipnet = "2.11"

# Web/API
axum = { version = "0.8", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Leptos
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Auth
argon2 = "0.5"
jsonwebtoken = "11.1"
rand = "0.9.2"

# Use the system SQLite on Arch (including makepkg builds).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-unbundled", "migrate", "macros"] }

# Others
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
