# Kernel modules used by traffic shaping (SQM with CAKE).
#
# keystone-daemon runs with ProtectKernelModules=yes, so it cannot load these
# itself. systemd-modules-load loads them at boot, before the daemon starts.
# sch_cake: the CAKE qdisc; ifb: the intermediate device for download shaping;
# act_mirred and cls_matchall: redirect WAN ingress traffic to the IFB device.
sch_cake
ifb
act_mirred
cls_matchall
