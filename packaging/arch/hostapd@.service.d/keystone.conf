# Keystone drop-in for the hostapd package's template unit.
#
# Keystone runs one hostapd@<interface> for its Wi-Fi access point. hostapd
# joins a bridge that systemd-networkd creates, and at boot it can start before
# that bridge exists. It then exits, so restart it until the bridge is there
# rather than leaving the access point down until the next apply.
[Unit]
After=systemd-networkd.service

[Service]
Restart=on-failure
RestartSec=5
