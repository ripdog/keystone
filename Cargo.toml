[workspace]
members = ["core", "daemon", "web-ui", "ctl"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Keystone Project"]
license = "GPL-3.0-only"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
ipnet = "2.11"

# Web/API
axum = { version = "0.8", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Leptos
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"

# Auth
argon2 = "0.5"
jsonwebtoken = "10.2.0"
rand = "0.9.2"

# Database
# sqlx's `sqlite` feature should bundle SQLite, but proc-macros are built as host
# shared objects and can accidentally pick up system SQLite. Force bundled sqlite
# via an explicit libsqlite3-sys dependency.
# Database
# Use system SQLite on Arch to avoid proc-macro symbol issues when building under makepkg.
# `sqlite-unbundled` links against the distro-provided libsqlite3.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite-unbundled", "migrate", "macros"] }

# Others
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
