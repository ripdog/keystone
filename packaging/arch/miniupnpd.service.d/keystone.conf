# Keystone drop-in for the miniupnpd package's unit (miniupnpd-nft).
#
# Keystone creates its own nftables table, keystone_upnp, before it starts
# miniupnpd, so the packaged unit's helper scripts are cleared here:
#
# - ExecStartPre runs nft_init.sh, which creates "filter" tables and chains
#   with miniupnpd's default names. On a Keystone router those names belong to
#   the firewall (the "inet filter" family) and must not be touched.
# - ExecStopPost runs nft_removeall.sh, which deletes the same default names.
#
# Keystone removes its table when UPnP is disabled, so nothing is lost by
# clearing them.
#
# ExecStart is restated because the miniupnpd-nft AUR package installs the
# upstream unit with its %BINDIR% / %CONFIGDIR% placeholders unsubstituted.
# systemd reads "%B" as the OS build ID ("rolling" on Arch), so the packaged
# unit tries to run "/rollingINDIR%/miniupnpd" and fails with status 127.
# The installed binary daemonizes by default (it has no -D) and takes the
# pidfile with -P (-p is the listening port), so the unit is Type=forking.
[Service]
Type=forking
ExecStartPre=
ExecStopPost=
ExecStart=
ExecStart=/bin/sh -c 'exec /usr/bin/miniupnpd \
	-f /etc/miniupnpd/miniupnpd.conf \
	-P /run/miniupnpd/miniupnpd.pid \
	-u "$(systemd-id128 --uuid machine-id)" "$@" \
' - $MINIUPNPD_ARGS
