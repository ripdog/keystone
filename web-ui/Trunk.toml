[build]
target = "index.html"
release = false
locked = true
dist = "dist"
public-url = "/"
filehash = false

[watch]
ignore = ["dist"]

[tools]
# Standalone Tailwind CSS v3 CLI, downloaded by trunk at build time.
# Stay on v3: v4 changes default ring width, border colour and shadow names.
tailwindcss = "3.4.17"

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

# Proxy API requests to the daemon (running with KEYSTONE_DEV=1)
[[proxy]]
backend = "http://127.0.0.1:3000/"
rewrite = "/api/"

[[hooks]]
stage = "pre_build"
command = "echo"
command_arguments = ["Building WASM frontend..."]
