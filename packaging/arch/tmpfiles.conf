# Create runtime directory for keystone socket
d /run/keystone 0755 root root -

# Provision writable paths before the daemon's ProtectSystem=strict sandbox.
d /etc/systemd/networkd.conf.d 0755 root root -
d /etc/dnsmasq.d 0755 root root -
d /etc/avahi 0755 root root -
d /etc/ssh/sshd_config.d 0755 root root -
d /var/lib/dnsmasq 0755 dnsmasq dnsmasq -

# Caddy access log directory. It must exist before the daemon starts: the
# unit's optional (-) ReadWritePaths entry is skipped when the path is missing,
# leaving /var/log read-only so Caddy cannot create it. Owned by the caddy user
# because the validator runs as caddy; skipped with a warning if Caddy is not
# installed.
d /var/log/caddy 0750 caddy caddy -
