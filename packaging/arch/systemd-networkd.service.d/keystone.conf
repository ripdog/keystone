# Keystone drop-in for systemd-networkd.service.
#
# Some ISP gateways send Router Advertisements every few seconds with a
# malformed Prefix Information option (prefix ::/64, no autonomous flag).
# networkd rejects that option and logs a warning for every RA, which floods
# the journal. The default route, RDNSS and the rest of the RA are still
# processed, so the warning carries no information.
#
# journald cannot filter by message content; LogFilterPatterns= (systemd 253+)
# makes the service's own log output skip matching lines before they are sent.
# Only this one message is dropped.
[Service]
LogFilterPatterns=~Failed to parse NDisc option 3, ignoring
