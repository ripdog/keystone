[advisories]
ignore = [
    # Marvin Attack on the `rsa` crate (no fixed release exists). It is pulled
    # in by jsonwebtoken's `rust_crypto` backend, but Keystone only signs and
    # verifies HS256 tokens with a symmetric key; no RSA operation is ever
    # performed. Revisit when jsonwebtoken or `rsa` offers a way to drop it.
    "RUSTSEC-2023-0071",
]
